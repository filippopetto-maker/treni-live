<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Treni Live Italia</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <div id="ticker" aria-label="Notizie sulla circolazione">
    <span class="tk-label">INFO<span id="tkScope">Italia</span></span>
    <div class="tk-view"><div class="tk-track" id="tkTrack"><div class="tk-run"><span class="tk-item">Carico le notizie…</span></div></div></div>
  </div>

  <aside id="panel">
    <header>
      <h1>Treni Live <span>Italia</span></h1>
      <button id="collapse" title="Riduci pannello" aria-label="Riduci pannello">–</button>
    </header>

    <nav class="tabs">
      <button data-tab="tab-map" class="on">🗺️ Mappa live</button>
      <button data-tab="tab-nav">🧭 Percorso</button>
    </nav>

    <div class="body tab hidden" id="tab-nav">
      <div class="navform">
        <div class="place">
          <i class="pin-dot from"></i>
          <input id="navFrom" type="text" placeholder="Partenza: indirizzo, luogo o fermata" autocomplete="off" />
          <button id="navHere" type="button" title="La mia posizione">◎</button>
          <ul class="sugg"></ul>
        </div>
        <div class="place">
          <i class="pin-dot to"></i>
          <input id="navTo" type="text" placeholder="Arrivo" autocomplete="off" />
          <button id="navSwap" type="button" title="Inverti">⇅</button>
          <ul class="sugg"></ul>
        </div>
        <div class="when">
          <select id="navWhen">
            <option value="now">Parti adesso</option>
            <option value="at">Parti alle…</option>
          </select>
          <input id="navTime" class="hidden" type="datetime-local" />
          <button id="navClear" type="button">Azzera</button>
        </div>
      </div>
      <p id="navMsg" class="muted">Roma e Milano: bus, tram, metro e treni. Tasto destro sulla mappa per scegliere un punto; zoomando vedi le fermate con le prossime partenze.</p>
      <ol id="navResults"></ol>
    </div>

    <div class="body tab" id="tab-map">
      <form id="search" autocomplete="off">
        <input id="q" type="search" placeholder="Cerca treno (es. 9651, Italo 8981)" />
      </form>

      <div class="filters">
        <label><input type="checkbox" data-cat="av" checked /><i class="dot av"></i>Frecce<b data-count="av">0</b></label>
        <label><input type="checkbox" data-cat="italo" checked /><i class="dot italo"></i>Italo<b data-count="italo">0</b></label>
        <label><input type="checkbox" data-cat="ic" checked /><i class="dot ic"></i>Intercity / EC<b data-count="ic">0</b></label>
        <label><input type="checkbox" data-cat="reg" checked /><i class="dot reg"></i>Regionali<b data-count="reg">0</b></label>
        <label><input type="checkbox" id="transitToggle" checked /><i class="dot bus"></i>Bus, tram, filobus<b id="transitCount">zoom</b></label>
        <label><input type="checkbox" id="metroToggle" checked /><i class="dot metro"></i>Metro <small class="muted">(da orario)</small><b id="metroCount">zoom</b></label>
      </div>
      <div id="metroStatus"></div>
      <div class="legend urban">
        <span><i class="dot bus"></i>bus</span>
        <span><i class="dot tram"></i>tram</span>
        <span><i class="dot filobus"></i>filobus</span>
        <span><i class="dot metro"></i>metro (colore linea)</span>
      </div>

      <div class="legend">
        <span><i class="ring ok"></i>in orario</span>
        <span><i class="ring warn"></i>5–15'</span>
        <span><i class="ring bad"></i>&gt;15'</span>
      </div>

      <p id="status">Avvio in corso…</p>
      <p id="hint"></p>
    </div>
  </aside>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
  <script src="nav.js"></script>
  <script src="ticker.js"></script>
</body>
</html>
