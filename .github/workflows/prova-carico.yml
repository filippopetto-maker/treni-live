# Prove di carico sul sito online (Render): notte, picco delle 8 e delle 12 del 4 ottobre 2026.
# Girano sui server di GitHub, così il Mac può restare spento. I risultati finiscono nel riepilogo
# dell'esecuzione e nel ramo "risultati-carico" (Render pubblica solo "main": nessun riavvio).
name: Prova di carico

on:
  workflow_dispatch:
    inputs:
      etichetta:
        description: Nome della prova
        default: manuale
  push:
    branches: [main]
    paths: [.github/workflows/prova-carico.yml]
  schedule:
    - cron: '50 5 * * *' # ~08:00 ora italiana
    - cron: '50 9 * * *' # ~12:00 ora italiana

permissions:
  contents: write

concurrency: prova-carico

jobs:
  carico:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Solo per le prove del 4 ottobre 2026
        id: data
        run: |
          if [ "${{ github.event_name }}" = schedule ] && [ "$(TZ=Europe/Rome date +%F)" != 2026-10-04 ]; then echo "salta=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.data.outputs.salta != '1'
      - uses: actions/setup-node@v4
        if: steps.data.outputs.salta != '1'
        with:
          node-version: 22
      - name: Attesa fine aggiornamento di Render
        if: steps.data.outputs.salta != '1' && github.event_name == 'push'
        run: sleep 360
      - name: Prova di carico
        if: steps.data.outputs.salta != '1'
        env:
          OUT_DIR: /tmp/risultati
          ETICHETTA: ${{ inputs.etichetta || (github.event_name == 'push' && 'notte') || (github.event.schedule == '50 5 * * *' && 'picco-08') || 'picco-12' }}
        run: node deploy/carico/prova-carico.mjs "$ETICHETTA"
      - name: Pubblica i risultati
        if: steps.data.outputs.salta != '1' && always()
        run: |
          ls /tmp/risultati/*.txt >/dev/null 2>&1 || exit 0
          cat /tmp/risultati/*.txt >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin risultati-carico >/dev/null; then
            git fetch --depth 1 origin risultati-carico && git switch -f risultati-carico
          else
            git switch --orphan risultati-carico
          fi
          cp /tmp/risultati/*.txt .
          git add ./*.txt
          git commit -m "Risultati prova di carico"
          git push origin risultati-carico
