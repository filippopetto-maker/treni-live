# Configurazione per Render (piano gratuito, nessuna carta richiesta).
services:
  - type: web
    name: treni-live
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    # Per proteggere la mappa con una password: aggiungi la variabile TRENI_PASSWORD
    # nella pagina del servizio su Render (Environment). Senza, la mappa è aperta.
